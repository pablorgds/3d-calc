services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: custo
      POSTGRES_PASSWORD: custo
      POSTGRES_DB: custo_chapa
    volumes:
      - custo-chapa-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U custo -d custo_chapa"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
  app:
    image: node:24
    working_dir: /app
    entrypoint: ["sh", "/app/docker/dev-entrypoint.sh"]
    command: ["npm", "run", "dev"]
    environment:
      DATABASE_URL: postgresql://custo:custo@postgres:5432/custo_chapa
      SENHA_ADMIN: ${SENHA_ADMIN:-}
    ports:
      - "4317:4317"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  custo-chapa-pg:
